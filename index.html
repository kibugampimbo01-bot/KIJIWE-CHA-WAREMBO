<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ukurasa wa Viungo</title>
  <style>
    :root {
      /* Badilisha rangi ya background hapa chini upendavyo */
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #111827;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 24px 14px 40px;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
    }

    .profile-box {
      text-align: center;
      margin-bottom: 22px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #1f2937;
      margin-bottom: 12px;
      background-color: #e5e7eb;
    }

    .bio-text {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      text-transform: uppercase;
      color: var(--text-color);
    }

    .link-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--card-bg);
      text-decoration: none;
      color: var(--text-color);
      padding: 10px 14px;
      border-radius: 10px;
      border: 3px solid #2563eb;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
    }

    .thumb {
      width: 54px;
      height: 54px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: #e5e7eb;
    }

    .card-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      text-transform: uppercase;
    }

    /* Rangi za fremu za kila kadi */
    .border-green { border-color: #16a34a; }
    .border-red { border-color: #dc2626; }
    .border-blue { border-color: #2563eb; }
    .border-purple { border-color: #9333ea; }
    .border-orange { border-color: #ea580c; }
    .border-lime { border-color: #65a30d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-box">
      <img
        class="avatar"
        src="https://via.placeholder.com/150?text=Profile"
        alt="Picha ya wasifu"
      />
      <p class="bio-text">
        Weka maelezo yako mafupi hapa chini ya picha ya wasifu
      </p>
    </div>

    <div class="link-list">
      <a class="link-card border-green" href="#">
        <img class="thumb" src="https://via.placeholder.com/80?text=1" alt="Kadi 1" />
        <span class="card-title">Kichwa cha Kiungo cha Kwanza</span>
      </a>

      <a class="link-card border-red" href="#">
        <img class="thumb" src="https://via.placeholder.com/80?text=2" alt="Kadi 2" />
        <span class="card-title">Kichwa cha Kiungo cha Pili</span>
      </a>

      <a class="link-card border-blue" href="#">
        <img class="thumb" src="https://via.placeholder.com/80?text=3" alt="Kadi 3" />
        <span class="card-title">Kichwa cha Kiungo cha Tatu</span>
      </a>

      <a class="link-card border-purple" href="#">
        <img class="thumb" src="https://via.placeholder.com/80?text=4" alt="Kadi 4" />
        <span class="card-title">Kichwa cha Kiungo cha Nne</span>
      </a>

      <a class="link-card border-orange" href="#">
        <img class="thumb" src="https://via.placeholder.com/80?text=5" alt="Kadi 5" />
        <span class="card-title">Kichwa cha Kiungo cha Tano</span>
      </a>

      <a class="link-card border-lime" href="#">
        <img class="thumb" src="https://via.placeholder.com/80?text=6" alt="Kadi 6" />
        <span class="card-title">Kichwa cha Kiungo cha Sita</span>
      </a>
    </div>
  </div>
</body>
</html>
