<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet & Withdraw - Creator Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #021238;
            color: #ffffff;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }
        .dashboard {
            width: 100%;
            max-width: 460px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 18px;
            color: #ffdd00;
        }
        .badge-admin {
            background: rgba(0, 230, 57, 0.2);
            color: #00e639;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        /* Kadi ya Salio */
        .balance-card {
            background: linear-gradient(135deg, #0b2463, #06153d);
            border: 2px solid #00e639;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .label {
            font-size: 13px;
            color: #b8c7e8;
        }
        .main-balance {
            font-size: 32px;
            font-weight: 900;
            color: #00e639;
            margin: 6px 0 14px;
        }
        .breakdown {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 12px;
            font-size: 13px;
        }
        .breakdown div span {
            display: block;
            font-weight: bold;
            font-size: 15px;
            margin-top: 3px;
        }
        .cut-text { color: #ff4d4d; }
        /* Fomu ya Withdraw */
        .withdraw-box {
            background: #0b1e4d;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .withdraw-box h3 {
            font-size: 16px;
            margin-bottom: 14px;
            color: #ffdd00;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            background: #ffffff;
            color: #000000;
        }
        .withdraw-btn {
            width: 100%;
            padding: 14px;
            background: #00e639;
            color: #000000;
            font-weight: 900;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 6px;
        }
        /* Historia ya Miamala */
        .history-box h3 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #e0e6f5;
        }
        .tx-item {
            background: rgba(255,255,255,0.07);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .status-pending {
            background: #ffdd00;
            color: #000;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }
        .status-paid {
            background: #00e639;
            color: #000;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h2>AKAUNTI YANGU (WALLET)</h2>
        <span class="badge-admin">Makato ya Mfumo: 20%</span>
    </div>

    <!-- KADI YA SALIO NA MAKATO -->
    <div class="balance-card">
        <div class="label">SALIO HALISI LA KUTOA (BAADA YA MAKATO)</div>
        <div id="netBalanceDisplay" class="main-balance">TSh 40,000</div>
        
        <div class="breakdown">
            <div>
                Jumla ya Mauzo
                <span id="grossDisplay">TSh 50,000</span>
            </div>
            <div>
                Makato ya Huduma (20%)
                <span id="feeDisplay" class="cut-text">- TSh 10,000</span>
            </div>
        </div>
    </div>

    <!-- FOMU YA KUOMBA KUTOA PESA (WITHDRAW) -->
    <div class="withdraw-box">
        <h3>OMBA KUTOA PESA (WITHDRAW)</h3>
        
        <div class="form-group">
            <label>Chagua Mtandao wa Simu</label>
            <select id="networkSelect">
                <option value="M-Pesa">M-Pesa (Vodacom)</option>
                <option value="Tigo Pesa">Mixx by Yas (Tigo Pesa)</option>
                <option value="Airtel Money">Airtel Money</option>
                <option value="Halopesa">Halopesa</option>
            </select>
        </div>

        <div class="form-group">
            <label>Namba ya Simu ya Kupokea Pesa</label>
            <input type="tel" id="phoneInput" placeholder="Mfano: 0754 000 000">
        </div>

        <div class="form-group">
            <label>Jina la Usajili wa Namba</label>
            <input type="text" id="nameInput" placeholder="Andika jina kamili la laini">
        </div>

        <div class="form-group">
            <label>Kiasi Unachotoa (TZS)</label>
            <input type="number" id="amountInput" value="40000">
        </div>

        <button class="withdraw-btn" onclick="requestWithdraw()">TUMA OMBI LA KUTOA PESA</button>
    </div>

    <!-- HISTORIA YA MAOMBI YA WITHDRAW -->
    <div class="history-box">
        <h3>HISTORIA YA MIAMALA YAKO</h3>
        <div id="txList">
            <div class="tx-item">
                <div>
                    <strong>TSh 16,000</strong> (M-Pesa • 0754***120)<br>
                    <small style="color:#aaa;">20 Nov 2026 • Makato yalikatwa: TSh 4,000</small>
                </div>
                <span class="status-paid">IMELIPWA</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Mfano wa mahesabu ya awali (Wewe Admin unaweza kubadili asilimia ya makato)
    const commissionRate = 0.20; // 20% makato yako
    let grossEarnings = 50000;
    let adminFee = grossEarnings * commissionRate;
    let netBalance = grossEarnings - adminFee;

    // Namba yako wewe Admin ya kupokea ombi la Withdraw WhatsApp
    const adminWhatsApp = '255700000000';

    function updateDisplay() {
        document.getElementById('grossDisplay').innerText = 'TSh ' + grossEarnings.toLocaleString();
        document.getElementById('feeDisplay').innerText = '- TSh ' + adminFee.toLocaleString();
        document.getElementById('netBalanceDisplay').innerText = 'TSh ' + netBalance.toLocaleString();
        document.getElementById('amountInput').value = netBalance;
    }

    function requestWithdraw() {
        const network = document.getElementById('networkSelect').value;
        const phone = document.getElementById('phoneInput').value.trim();
        const fullName = document.getElementById('nameInput').value.trim();
        const amount = parseInt(document.getElementById('amountInput').value);

        if (!phone || !fullName || !amount) {
            alert('Tafadhali jaza taarifa zote za malipo!');
            return;
        }
        if (amount > netBalance || amount < 2000) {
            alert('Kiasi hakitoshi au kiko chini ya kiwango cha chini (TSh 2,000).');
            return;
        }

        // Punguza salio lake baada ya kuomba
        netBalance -= amount;
        updateDisplay();

        // Ongeza kwenye historia kama "INASUBIRI MALIPO"
        const txList = document.getElementById('txList');
        const newTx = document.createElement('div');
        newTx.className = 'tx-item';
        newTx.innerHTML = `
            <div>
                <strong>TSh ${amount.toLocaleString()}</strong> (${network} • ${phone})<br>
                <small style="color:#aaa;">Jina: ${fullName} • Leo</small>
            </div>
            <span class="status-pending">INASUBIRI MALIPO</span>
        `;
        txList.prepend(newTx);

        // Tuma taarifa moja kwa moja kwako Admin (WhatsApp) ili umtumie pesa
        const msg = encodeURIComponent(
            `🔔 *OMBI JIPYA LA WITHDRAW*\n\n` +
            `• Mtandao: ${network}\n` +
            `• Namba: ${phone}\n` +
            `• Jina: ${fullName}\n` +
            `• Kiasi cha Kumtumia: TSh ${amount.toLocaleString()}\n` +
            `• Makato yako (20%) yameshakata.\n\n` +
            `Tafadhali tuma muamala huu.`
        );
        window.open(`https://wa.me/${adminWhatsApp}?text=${msg}`, '_blank');
    }

    updateDisplay();
</script>

</body>
</html>
